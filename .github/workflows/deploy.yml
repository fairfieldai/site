# Builds once, then deploys the same build to dev and, after approval in the
# prod GitHub Environment, to prod.

name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - api/**
      - scripts/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-environment.yml
  workflow_dispatch:

permissions: {}

jobs:
  build-web:
    name: Build web
    runs-on: ubuntu-24.04-arm
    # A newer push cancels a build still in progress; its deploys then don't run.
    # The deploy jobs never cancel (see deploy-environment.yml).
    concurrency:
      group: ${{ github.workflow }}-build-web
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Next.js reuses compiled output from .next/cache across builds.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}-${{ hashFiles('web/app/**', 'web/lib/**', 'web/public/**', 'web/next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: web/out
          if-no-files-found: error
          include-hidden-files: true

  build-api:
    name: Build API
    runs-on: ubuntu-24.04-arm
    # A newer push cancels a build still in progress; its deploys then don't run.
    # The deploy jobs never cancel (see deploy-environment.yml).
    concurrency:
      group: ${{ github.workflow }}-build-api
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-lambda links with Zig against Lambda's older glibc. setup-zig also
      # caches Zig's global cache, so its runtime libraries aren't rebuilt each run.
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install cargo-lambda
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-lambda

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: api

      - run: cargo lambda build --release --arm64 --locked --output-format zip

      # One zip per binary. Listed explicitly so stale output restored by the
      # Rust cache never ships.
      - name: Upload functions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda
          path: |
            api/target/lambda/api/bootstrap.zip
            api/target/lambda/discord/bootstrap.zip
          if-no-files-found: error

  dev:
    name: Deploy dev
    needs: [build-web, build-api]
    permissions:
      contents: read
      id-token: write
    # actionlint 1.7.12 does not parse the $/ self-repository syntax yet.
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[self-repository]
    with:
      environment: dev

  prod:
    name: Deploy prod
    needs: dev
    permissions:
      contents: read
      id-token: write
    # actionlint 1.7.12 does not parse the $/ self-repository syntax yet.
    uses: ./.github/workflows/deploy-environment.yml # zizmor: ignore[self-repository]
    with:
      environment: prod
