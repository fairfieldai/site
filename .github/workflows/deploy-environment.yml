# Deploys the web and api artifacts from the calling run to one environment.
# AWS_ROLE_ARN, AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
# LAMBDA_FUNCTION_NAME, COGNITO_DOMAIN, COGNITO_CLIENT_ID, and COGNITO_ISSUER are
# GitHub Environment variables managed by Terraform in fairfieldai/infra.

name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_ISSUER: ${{ vars.COGNITO_ISSUER }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web/out

      - name: Download function
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api
          path: api

      # One build serves every environment; the site reads these at runtime.
      - name: Write runtime config
        run: |
          jq -n \
            --arg cognitoDomain "$COGNITO_DOMAIN" \
            --arg cognitoClientId "$COGNITO_CLIENT_ID" \
            --arg cognitoIssuer "$COGNITO_ISSUER" \
            '{$cognitoDomain, $cognitoClientId, $cognitoIssuer}' >web/out/config.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The API goes first so new pages never call routes that don't exist yet.
      - name: Deploy API
        run: |
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://api/bootstrap.zip --output text --query LastUpdateStatus
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION_NAME"

      # Hashed assets never change, so they cache forever and upload before the
      # pages that reference them.
      - name: Upload static assets
        run: |
          aws s3 sync web/out/_next/static "s3://$S3_BUCKET/_next/static" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload pages
        run: |
          aws s3 sync web/out "s3://$S3_BUCKET" --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" --output text --query Invalidation.Id

      - name: Prune old static assets
        run: scripts/prune-static.sh "$S3_BUCKET" web/out 7
