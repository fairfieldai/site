[graph]
targets = ["aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0"]

[licenses.private]
# The api crate is never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "syn", reason = "Upstream proc macros are split between syn 2 and syn 3" },
  { crate = "base64", reason = "reqwest and hyper-util use 0.23; lambda_http and jsonwebtoken use 0.22" },
  { crate = "untrusted", reason = "aws-lc-rs uses 0.7; rustls-webpki uses 0.9" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
