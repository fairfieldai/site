[package]
name = "discord"
version.workspace = true
edition.workspace = true
publish.workspace = true

# cargo-lambda packages each binary as target/lambda/<name>/bootstrap.zip.
[[bin]]
name = "discord"
path = "src/main.rs"

[[bin]]
name = "discord-reminders"
path = "src/bin/reminders.rs"

[dependencies]
aws-config = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-lc-rs = { workspace = true, features = ["aws-lc-sys"] }
aws-sdk-cognitoidentityprovider = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { workspace = true, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { workspace = true, features = ["default-https-client", "rt-tokio"] }
axum = { workspace = true, features = ["json", "tokio"] }
lambda_http = { workspace = true, features = ["apigw_http", "tracing"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
shared = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
