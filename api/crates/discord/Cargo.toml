[package]
name = "discord"
version.workspace = true
edition.workspace = true
publish.workspace = true

# cargo-lambda packages each binary as target/lambda/<name>/bootstrap.zip.
[[bin]]
name = "discord"
path = "src/main.rs"

[dependencies]
aws-lc-rs = { workspace = true, features = ["aws-lc-sys"] }
axum = { workspace = true, features = ["json", "tokio"] }
lambda_http = { workspace = true, features = ["apigw_http", "tracing"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
