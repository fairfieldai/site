[package]
name = "api"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
lambda_http = { version = "1.3.1", default-features = false, features = ["apigw_http", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
# cargo-lambda links with Zig, which warns that rustc's default -O1 linker flag
# is deprecated. Native builds are unaffected.
linker_messages = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
