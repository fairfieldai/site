[workspace]
resolver = "3"
members = ["crates/api", "crates/discord", "crates/shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Exact versions, no default features, and no features here: each crate enables
# the features it uses.
aws-config = { version = "=1.12.0", default-features = false }
aws-lc-rs = { version = "=1.18.1", default-features = false }
aws-sdk-cognitoidentityprovider = { version = "=1.139.0", default-features = false }
aws-sdk-dynamodb = { version = "=1.130.0", default-features = false }
aws-sdk-ssm = { version = "=1.128.0", default-features = false }
axum = { version = "=0.8.9", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
jsonwebtoken = { version = "=11.1.0", default-features = false }
lambda_http = { version = "=1.3.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_json = { version = "=1.0.151", default-features = false }
shared = { path = "crates/shared", version = "=0.1.0" }
tokio = { version = "=1.53.2", default-features = false }
tower = { version = "=0.5.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-lambda links with Zig, which warns that rustc's default -O1 linker flag
# is deprecated. Native builds are unaffected.
linker_messages = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
